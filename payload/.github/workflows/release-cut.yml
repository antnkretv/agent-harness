name: Release cut

on:
  workflow_dispatch:

run-name: Release cut

concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  cut:
    runs-on: {{harness.runner.release}}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install harness kit
        run: python3 .harness/ah.py install || git ls-files --error-unmatch .harness/methodology.json

      - name: Resolve release token
        id: token
        run: >-
          "$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/lib/manifest.py --secret-slots release/tag-flow --slots 1 >> "$GITHUB_OUTPUT"

      - name: Cut release
        env:
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          SECRET_NAME_1: ${{ steps.token.outputs.secret-1 }}
          SECRET_VALUE_1: ${{ secrets[steps.token.outputs.secret-1] }}
        run: |
          set -euo pipefail
          . .harness/scripts/ci-common.sh
          if [ "$REF" != "refs/heads/{{git.baseBranch}}" ]; then
            annotate error @release_cut_ref "{{git.baseBranch}}" "$REF"
            exit 1
          fi
          "$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/scripts/release/release.py cut --push --release-token
