name: alert-triage

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: Номер issue алерта, который разобрать заново
        required: false
        type: string

permissions: {}

env:
  AGENT_PROVIDER: '{{harness.extension.ci-agent}}'

jobs:
  select:
{{#if modules.alert-triage.settings.environment}}    environment: {{modules.alert-triage.settings.environment}}
{{/if}}    env:
      {{modules.alert-triage.settings.auth.secret}}: ${{ secrets.{{modules.alert-triage.settings.auth.secret}} }}
{{#if modules.alert-triage.settings.selectRunnerVar}}    if: github.ref == 'refs/heads/{{git.baseBranch}}' && vars.{{modules.alert-triage.settings.selectRunnerVar}} != ''
    runs-on: ${{ fromJSON(vars.{{modules.alert-triage.settings.selectRunnerVar}}) }}
{{else}}    if: github.ref == 'refs/heads/{{git.baseBranch}}'
    runs-on: {{harness.runner.triage}}
{{/if}}    timeout-minutes: 10
    concurrency:
      group: alert-triage-select
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      issues: ${{ steps.select.outputs.issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none

      - name: Install harness kit
        run: python3 .harness/ah.py install || git ls-files --error-unmatch .harness/methodology.json

      - name: agent-provider
        run: |
          set -euo pipefail
          provider=$("$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/scripts/check/check-pipeline.py --emit-provider alert-triage)
          "$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/lib/forge.py export-env "AGENT_PROVIDER=$provider"

      - name: select
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          AGENT_SECRET: {{#if module:ci-agent/codex}}${{ secrets.AGENT_GITHUB_TOKEN != '' }}{{/if}}{{#if module:ci-agent/claude-code}}${{ secrets.AGENT_GITHUB_TOKEN != '' && (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') }}{{/if}}{{#if module:ci-agent/cursor}}${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.CURSOR_API_KEY != '' }}{{/if}}
        run: >-
          "$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/scripts/agent/alert-triage.py select

      - name: link
        if: always() && steps.select.outcome != 'skipped'
        env:
          {{modules.alert-triage.settings.notifyToken.secret}}: ${{ secrets.{{modules.alert-triage.settings.notifyToken.secret}} }}
        run: >-
          "$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/scripts/agent/alert-triage.py link

  triage:
{{#if modules.alert-triage.settings.environment}}    environment: {{modules.alert-triage.settings.environment}}
{{/if}}    env:
      {{modules.alert-triage.settings.auth.secret}}: ${{ secrets.{{modules.alert-triage.settings.auth.secret}} }}
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.issues != '' && needs.select.outputs.issues != '[]' }}
    runs-on: {{harness.runner.triage}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    concurrency:
      group: alert-triage-${{ matrix.issue }}
      cancel-in-progress: false
    permissions:
      id-token: write
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install harness kit
        run: python3 .harness/ah.py install || git ls-files --error-unmatch .harness/methodology.json

      - name: agent-provider
        run: |
          set -euo pipefail
          provider=$("$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/scripts/check/check-pipeline.py --emit-provider alert-triage)
          "$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/lib/forge.py export-env "AGENT_PROVIDER=$provider"

      - name: prompt
        id: prompt
        env:
          ISSUE: ${{ matrix.issue }}
        run: |
          . .harness/scripts/ci-common.sh
          SCRIPTS="$RUNNER_TEMP/trusted-alert/.harness/scripts"
          "$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/lib/forge.py export-env "SCRIPTS=$SCRIPTS"
          rm -rf "$SCRIPTS"
          mkdir -p "$(dirname "$SCRIPTS")"
          cp -R .harness/. "$(dirname "$SCRIPTS")/"
          if ! session=$("$GITHUB_WORKSPACE/.harness/hooks/python.cmd" .harness/scripts/check/check-pipeline.py --emit-agent alert-triage); then
            annotate error @triage_wf_no_session
            exit 1
          fi
          if ! printf '%s\n' "$session" | grep -qx "kind=$AGENT_PROVIDER"; then
            annotate error @triage_wf_provider_unavailable
            exit 1
          fi
          printf '%s\n' "$session" >> "$GITHUB_OUTPUT"

      - name: session-start
        id: session
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ -n "$GH_TOKEN" ]; then
            echo "agent=$("$SCRIPTS/../hooks/python.cmd" "$SCRIPTS/../lib/tracker.py" login)" >> "$GITHUB_OUTPUT"
          fi

      - name: agent
        id: agent
        timeout-minutes: 110
        env:
          PROVIDER: ${{ steps.prompt.outputs.kind }}
          MODEL: ${{ steps.prompt.outputs.model }}
          EFFORT: ${{ steps.prompt.outputs.effort }}
          PROMPT: ${{ steps.prompt.outputs.prompt }}
          ALLOWED_TOOLS: ${{ steps.prompt.outputs.allowed_tools }}
          DISALLOWED_TOOLS: ${{ steps.prompt.outputs.disallowed_tools }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          GITHUB_CHECKS_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ISSUE: ${{ matrix.issue }}
        run: |
          .harness/provisioning/scripts/ensure-agent-cli.sh "$PROVIDER" --ci
          printf '%s' "$PROMPT" > "$RUNNER_TEMP/grafana-agent-prompt.md"
          "$SCRIPTS/../hooks/python.cmd" "$SCRIPTS/agent/agent-run.py" --provider "$PROVIDER" --mode agent --issue "$ISSUE" --read-only-fallback \
            --model "$MODEL" --effort "$EFFORT" --prompt-file "$RUNNER_TEMP/grafana-agent-prompt.md" \
            --allowed-tools "$ALLOWED_TOOLS" --disallowed-tools "$DISALLOWED_TOOLS" \
            --log "$RUNNER_TEMP/agent-execution-output.json" --workdir "$GITHUB_WORKSPACE"

      - name: session-digest
        if: always() && steps.prompt.outcome == 'success'
        env:
          PASS: alert-triage
          KIND: ${{ steps.prompt.outputs.kind }}
        run: |
          log="$RUNNER_TEMP/agent-execution-output.json"
          "$SCRIPTS/../hooks/python.cmd" "$SCRIPTS/agent/session-log-digest.py" "$log" "$KIND"

      - name: published
        if: always() && steps.session.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
          SINCE: ${{ steps.session.outputs.at }}
          AGENT_LOGIN: ${{ steps.session.outputs.agent }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: >-
          "$SCRIPTS/../hooks/python.cmd" "$SCRIPTS/agent/alert-triage.py" published
