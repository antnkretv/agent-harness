extends: substitution
message: "Канцелярит: лучше \"%s\" (сейчас \"%s\")"
scope: text
level: warning
ignorecase: true
swap:
  осуществляется: делается / выполняется
  осуществить: выполнить
  осуществлять: выполнять
  данный (?=\S): этот
  данная: эта
  данное: это
  данные настройки: эти настройки
  является: '-  (тире или переформулировать глаголом)'
  необходимо: нужно
  требуется указать: укажите
  отсутствует: нет
  имеется: есть
  производится: выполняется
  'в случае если': если
  'в случае, если': если
  в настоящий момент: сейчас
  в настоящее время: сейчас
  с целью: чтобы
  при помощи: с помощью
  посредством: через
  во избежание: чтобы не
  предоставляет возможность: позволяет
  осуществление: (переформулировать глаголом)
  выполните операцию: (назвать действие прямо)
  для того чтобы: чтобы
  'для того, чтобы': чтобы
  'в связи с тем, что': потому что
  'в силу того, что': потому что
  'по причине того, что': потому что
  'в том случае, если': если
  'несмотря на тот факт, что': хотя
  имеет возможность: может
  имеют возможность: могут
  есть возможность: можно
  не представляется возможным: нельзя
  вне зависимости от: независимо от
  на регулярной основе: регулярно
  на постоянной основе: постоянно
  в автоматическом режиме: автоматически
  в ручном режиме: вручную
  большое количество: много
  значительное количество: много
  оказывает влияние: влияет
  оказывают влияние: влияют
