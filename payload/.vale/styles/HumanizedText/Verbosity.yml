extends: existence
message: "Пиши, сокращай: \"%s\" не добавляет фактов - вычеркнуть или сказать короче"
scope: text
level: warning
ignorecase: true
raw:
  - '\bтаким образом[,:]|'
tokens:
  - как (?:было )?(?:сказано|описано|отмечено|упомянуто) (?:выше|ранее)
  - как упоминалось
  - как отмечалось
  - выше по тексту
  - напомним
  - напомню
  - повторюсь
  - резюмируя
  - подводя итог\w*
  - очевидно, что
  - разумеется
  - само собой разумеется
  - как известно
  - не секрет, что
  - нетрудно заметить
  - легко видеть
  - следует понимать
  - нужно понимать, что
  - (?:стоит|следует|необходимо|важно) подчеркнуть
  - на самом деле
  - другими словами
  - иными словами
  - проще говоря
  - в общем и целом
  - так или иначе
  - по большому счету
  - в конечном итоге
  - в конечном счете
  - как бы то ни было
