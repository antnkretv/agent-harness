extends: existence
message: "Раздел заполнен отпиской: удалите необязательный раздел целиком или напишите, что в нем сделано и почему (docs/platform/standards/text.md#язык-описаний-задач-и-комментариев)"
scope: raw
level: error
ignorecase: true
nonword: true
raw:
  - '(?<=\A|\n)#{2,3} [^\n]+\n(?:[ \t]*<!--[^\n]*-->[ \t]*\n)*\s*'
  - '(?:(?:[-*][ \t]+)?(?:\*\*[^*\n]{1,40}\*\*[ \t]*)?'
  - '(?:нет|находок нет|отступлений нет|не требуется|не меняется|не меняются|граница не меняется|все сделано)'
  - '(?:,[^\n`]{0,30})?\.?[ \t]*(?:\n|\z)\s*){1,4}'
  - '(?=#{2,3} |<|---|\z)'
