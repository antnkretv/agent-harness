# harness:begin core
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles =

[*.{cs,ps1,py,ts,tsx}]
BasedOnStyles =

[*.txt]
BasedOnStyles =

[.harness/**/*.{md,py,ps1}]
BasedOnStyles = HumanizedText
HumanizedText.LockTerm = YES

[*.messages.txt]
BasedOnStyles = HumanizedText
HumanizedText.GenericError = YES

[*.commit.md]
BasedOnStyles = HumanizedText
HumanizedText.LockTerm = NO

[*.publish.md]
BasedOnStyles = HumanizedText, Publication
HumanizedText.LockTerm = NO

[.harness/templates/**/*.md]
BasedOnStyles = HumanizedText, Publication
# harness:end core

# project:begin
# project:end
